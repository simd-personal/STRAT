<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- Car body -->
  <rect x="2" y="8" width="20" height="8" rx="2" fill="black" stroke="white" stroke-width="0.5" filter="url(#shadow)"/>
  <!-- Car roof -->
  <rect x="6" y="4" width="12" height="4" rx="1" fill="black" stroke="white" stroke-width="0.5"/>
  <!-- Windows -->
  <rect x="7" y="5" width="4" height="2" fill="white" opacity="0.8"/>
  <rect x="13" y="5" width="4" height="2" fill="white" opacity="0.8"/>
  <!-- Wheels -->
  <circle cx="6" cy="16" r="2" fill="black" stroke="white" stroke-width="0.5"/>
  <circle cx="18" cy="16" r="2" fill="black" stroke="white" stroke-width="0.5"/>
  <!-- Wheel centers -->
  <circle cx="6" cy="16" r="0.8" fill="white"/>
  <circle cx="18" cy="16" r="0.8" fill="white"/>
  <!-- Headlights -->
  <circle cx="4" cy="10" r="0.5" fill="white"/>
  <circle cx="20" cy="10" r="0.5" fill="white"/>
</svg>